{% extends "base.html" %}
{% block title %}Sumber Data{% endblock %}
{% block content %}
<h3>Kelola Sumber Data</h3>
<table class="table table-sm bg-white mt-3">
  <thead><tr><th>Nama</th><th>Tipe</th><th>Config</th><th>Dibuat</th></tr></thead>
  <tbody>
  {% for s in sources %}
    <tr><td>{{ s.name }}</td><td>{{ s.source_type }}</td><td><code class="small">{{ s.config_json or '-' }}</code></td><td>{{ s.created_at }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
