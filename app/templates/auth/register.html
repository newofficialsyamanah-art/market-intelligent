{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="card p-4" style="width:420px;">
    <h4 class="mb-3 text-center">Buat Akun</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Nama</label><input name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option value="admin">Admin/IT</option>
          <option value="business_analyst">Business Analyst</option>
          <option value="marketing">Marketing</option>
          <option value="management">Management</option>
        </select>
      </div>
      <button class="btn btn-primary w-100">Daftar</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Kembali ke login</a></p>
  </div>
</div>
{% endblock %}
