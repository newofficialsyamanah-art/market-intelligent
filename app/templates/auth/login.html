{% extends "base.html" %}
{% block title %}Login - Market Intelligence System{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="card p-4" style="width:380px;">
    <h4 class="mb-3 text-center">Market Intelligence System</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <div class="mt-3 pt-3 border-top text-center">
      <span class="small text-muted d-block mb-1">Penyedia Bahan Baku Tekstil & Kain?</span>
      <a href="{{ url_for('auth.register_supplier') }}" class="btn btn-outline-success btn-sm w-100">
        <i class="bi bi-box-seam me-1"></i> Daftar Sebagai Rekanan Supplier
      </a>
    </div>
    <p class="text-center mt-3 mb-0 small"><a href="{{ url_for('auth.register') }}" class="text-muted">Buat akun admin awal</a></p>
  </div>
</div>
{% endblock %}
